@if (isOpen) {

  <div class="construction-modal">

    <!-- Overlay -->
    <div
      class="construction-overlay"
      (click)="close()">
    </div>

    <!-- Modal -->
    <div class="construction-box">

      <!-- Close -->
      <button
        class="construction-close"
        type="button"
        aria-label="Close"
        (click)="close()">

        <i class="fa-solid fa-xmark"></i>

      </button>

      <!-- Icon -->
      <div class="construction-icon">

        <i class="fa-solid fa-screwdriver-wrench"></i>

      </div>

      <h2>
        Website Coming Soon
      </h2>

      <p>
        Our website is currently under construction.
        We are preparing a better matchmaking experience
        for you.
      </p>

      <!-- Countdown -->
      <div class="construction-countdown">

        <div>
          <strong>{{ days }}</strong>
          <span>Days</span>
        </div>

        <div>
          <strong>{{ hours }}</strong>
          <span>Hours</span>
        </div>

        <div>
          <strong>{{ minutes }}</strong>
          <span>Minutes</span>
        </div>

        <div>
          <strong>{{ seconds }}</strong>
          <span>Seconds</span>
        </div>

      </div>

      <p class="construction-note">
        You can still register with google form.
      </p>

      <a
        href="https://forms.gle/mJUz9amoyYWsjCeJA"
        target="_blank"
        rel="noopener noreferrer"
        class="construction-register">

        <i class="fa-solid fa-user-plus"></i>

        Open google form

      </a>

    </div>

  </div>

}
