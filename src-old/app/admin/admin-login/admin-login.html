<div class="admin-login-page">

  <div class="admin-login-container">

    <!-- Logo / Brand -->
    <div class="brand-section">

      <div class="brand-mark">
        MW
      </div>

      <h1>Match With Ijas</h1>

      <p>Admin Panel</p>

    </div>


    <!-- Login Card -->
    <div class="login-card">

      <div class="card-header">

        <span class="eyebrow">
          ADMIN ACCESS
        </span>

        <h2>Admin Login</h2>

        <p>
          Sign in to manage profiles, verification and platform activity.
        </p>

      </div>


      <form (ngSubmit)="login()">

        <!-- Username -->
        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter admin username"
            autocomplete="username"
          />

        </div>


        <!-- Password -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter password"
              autocomplete="current-password"
            />

            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>

          </div>

        </div>


        <!-- Error -->
        @if (errorMessage) {

          <div class="error-message">
            {{ errorMessage }}
          </div>

        }


        <!-- Login Button -->
        <button
          type="submit"
          class="login-button"
          [disabled]="isLoading"
        >

          @if (isLoading) {
            <span>Signing in...</span>
          } @else {
            <span>Sign In</span>
          }

        </button>

      </form>


      <div class="security-note">

        <span class="security-icon">🔒</span>

        <span>
          Admin access is restricted to authorized staff only.
        </span>

      </div>

    </div>


    <!-- Footer -->
    <div class="login-footer">

      <span>
        Match With Ijas
      </span>

      <span>•</span>

      <span>
        Admin Portal
      </span>

    </div>

  </div>

</div>
