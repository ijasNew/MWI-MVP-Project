<!-- MOBILE HEADER -->

<header class="mobile-header">

  <button type="button" class="menu-btn" (click)="toggleMenu()" aria-label="Open menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <span class="mobile-logo">
    Match With Ijas
  </span>

</header>


<!-- MOBILE OVERLAY -->

@if (menuOpen) {

<div class="sidebar-overlay" (click)="toggleMenu()"></div>

}


<!-- SIDEBAR -->

<aside class="sidebar" [class.open]="menuOpen">


  <!-- BRAND -->

  <div class="sidebar-brand">

    <span>
      Match With Ijas
    </span>

    <small>
      Verified Matchmaking
    </small>

  </div>


  <!-- USER -->

  <div class="sidebar-user">

    <div class="user-avatar">

      @if (user?.photos?.length) {

      <img [src]="user.photos[0]" alt="Profile photo">

      } @else {

      {{ getInitials(user?.fullName) }}

      }

    </div>

    <div class="user-info">

      <strong>
        {{ user?.fullName || 'User' }}
      </strong>

      <span>
        {{ user?.memberId || user?.profileId || '' }}
      </span>

    </div>

  </div>


  <!-- MAIN MENU -->

  <nav class="dashboard-menu">


    <!-- HOME -->

    <button type="button" class="menu-item" [class.active]="activeMenu === 'home'" (click)="selectMenu('home')">

      <i class="fa-solid fa-house"></i>

      <span>
        Home
      </span>

    </button>


    <!-- INTERESTS -->

    <button type="button" class="menu-item" [class.active]="activeMenu === 'interests'"
      (click)="selectMenu('interests')">

      <i class="fa-solid fa-heart"></i>

      <span>
        Interests
      </span>

    </button>


    <!-- SHORTLISTED -->

    <button type="button" class="menu-item" [class.active]="activeMenu === 'shortlisted'"
      (click)="selectMenu('shortlisted')">

      <i class="fa-solid fa-star"></i>

      <span>
        Shortlisted Profiles
      </span>

    </button>


    <!-- MY DETAILS -->

    <button type="button" class="menu-item" [class.active]="activeMenu === 'details'" (click)="selectMenu('details')">

      <i class="fa-solid fa-user"></i>

      <span>
        My Details
      </span>

    </button>


    <!-- HELP -->

    <button type="button" class="menu-item" [class.active]="activeMenu === 'help'" (click)="selectMenu('help')">

      <i class="fa-solid fa-comment-dots"></i>

      <span>
        Help Us Improve
      </span>

    </button>


    <!-- UPGRADE -->

    <button type="button" class="menu-item" [class.active]="activeMenu === 'upgrade'" (click)="selectMenu('upgrade')">

      <i class="fa-solid fa-crown"></i>

      <span>
        Upgrade Profile
      </span>

    </button>


  </nav>


  <!-- BOTTOM -->

  <div class="sidebar-bottom">


    <!-- SETTINGS -->

    <button type="button" class="menu-item" [class.active]="activeMenu === 'settings'" (click)="selectMenu('settings')">

      <i class="fa-solid fa-gear"></i>

      <span>
        Settings
      </span>

    </button>


    <!-- LOGOUT -->

    <button type="button" class="menu-item logout-item" (click)="logout()">

      <i class="fa-solid fa-right-from-bracket"></i>

      <span>
        Logout
      </span>

    </button>


  </div>

</aside>
